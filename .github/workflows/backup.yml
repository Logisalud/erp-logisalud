name: Database Backup

on:
  # Backup automático diario a las 5:00 AM UTC (medianoche Perú, UTC-5)
  schedule:
    - cron: '0 5 * * *'

  # Snapshot manual bajo demanda
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del snapshot (opcional)'
        required: false
        default: 'Snapshot manual'

jobs:
  backup:
    name: pg_dump (session pooler) → Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Obtener región del proyecto desde API de Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Usamos el access token (ya configurado) para obtener la región
          REGION=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/qpkigzniatidsvnxikox" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['region'])")

          echo "Región detectada: $REGION"
          echo "SUPABASE_REGION=$REGION" >> "$GITHUB_ENV"

      - name: Generar dump via session pooler (IPv4)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          REASON="${{ github.event.inputs.reason || 'automatico-diario' }}"
          FILENAME="logisalud_${TIMESTAMP}.sql"

          # El session pooler es IPv4 y compatible con pg_dump (a diferencia del transaction pooler).
          # Host: aws-0-REGION.pooler.supabase.com  puerto: 5432
          # Usuario: postgres.PROJECT_REF  (el project ref va en el usuario, no en el host)
          DB_URL="postgresql://postgres.qpkigzniatidsvnxikox:${SUPABASE_DB_PASSWORD}@aws-0-${SUPABASE_REGION}.pooler.supabase.com:5432/postgres"

          echo "Iniciando pg_dump — $REASON"

          pg_dump "$DB_URL" \
            --no-owner \
            --no-acl \
            --schema=public \
            --format=plain \
            --file="$FILENAME"

          # Verificar que el dump no está vacío
          LINES=$(wc -l < "$FILENAME")
          echo "Líneas en el dump: $LINES"
          if [ "$LINES" -lt 50 ]; then
            echo "ERROR: El dump parece estar vacío o incompleto ($LINES líneas)."
            exit 1
          fi

          # Comprimir
          gzip "$FILENAME"

          SIZE=$(du -sh "${FILENAME}.gz" | cut -f1)
          echo "BACKUP_FILE=${FILENAME}.gz" >> "$GITHUB_ENV"
          echo "BACKUP_SIZE=$SIZE"          >> "$GITHUB_ENV"
          echo "TIMESTAMP=$TIMESTAMP"       >> "$GITHUB_ENV"
          echo "REASON=$REASON"             >> "$GITHUB_ENV"
          echo "Dump completado: ${FILENAME}.gz ($SIZE)"

      - name: Subir artifact (retención 90 días)
        uses: actions/upload-artifact@v4
        with:
          name: logisalud-backup-${{ env.TIMESTAMP }}
          path: "*.sql.gz"
          retention-days: 90

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Backup completado"
            echo "| Campo       | Valor |"
            echo "|-------------|-------|"
            echo "| Archivo     | \`${{ env.BACKUP_FILE }}\` |"
            echo "| Tamaño      | ${{ env.BACKUP_SIZE }} |"
            echo "| Región      | ${{ env.SUPABASE_REGION }} |"
            echo "| Motivo      | ${{ env.REASON }} |"
            echo "| Retención   | 90 días |"
            echo ""
            echo "Descarga desde **Summary → Artifacts** de este run."
          } >> "$GITHUB_STEP_SUMMARY"
