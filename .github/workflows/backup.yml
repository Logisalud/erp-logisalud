name: Database Backup

on:
  # Backup automático diario a las 5:00 AM UTC (medianoche Perú, UTC-5)
  schedule:
    - cron: '0 5 * * *'

  # Snapshot manual bajo demanda
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del snapshot (opcional)'
        required: false
        default: 'Snapshot manual'

jobs:
  backup:
    name: pg_dump → Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Obtener configuración de conexión desde API de Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # /v1/projects/{ref}/config/database devuelve el host del pooler exacto del proyecto
          CONFIG=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/qpkigzniatidsvnxikox/config/database")

          echo "Config recibida:"
          echo "$CONFIG" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d, indent=2))" 2>/dev/null || echo "$CONFIG"

          # Extraer el host del pooler (campo pool_host o similar)
          POOL_HOST=$(echo "$CONFIG" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          # Intentar varios campos conocidos de la API
          for key in ('pool_host', 'pooler_host', 'host'):
              if key in d and d[key]:
                  print(d[key])
                  break
          " 2>/dev/null || true)

          # Fallback: construir desde región si no vino en el config
          if [ -z "$POOL_HOST" ]; then
            REGION=$(curl -sf \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/qpkigzniatidsvnxikox" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['region'])")
            POOL_HOST="aws-0-${REGION}.pooler.supabase.com"
            echo "Pool host construido desde región: $POOL_HOST"
          else
            echo "Pool host desde API: $POOL_HOST"
          fi

          echo "POOL_HOST=$POOL_HOST" >> "$GITHUB_ENV"

      - name: Generar dump
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          REASON="${{ github.event.inputs.reason || 'automatico-diario' }}"
          FILENAME="logisalud_${TIMESTAMP}.sql"

          # Usuario del pooler: postgres.PROJECT_REF (incluye el ref en el nombre de usuario)
          DB_SESSION="postgresql://postgres.qpkigzniatidsvnxikox:${SUPABASE_DB_PASSWORD}@${{ env.POOL_HOST }}:5432/postgres?sslmode=require"
          DB_TRANSACTION="postgresql://postgres.qpkigzniatidsvnxikox:${SUPABASE_DB_PASSWORD}@${{ env.POOL_HOST }}:6543/postgres?sslmode=require"

          echo "Iniciando pg_dump — $REASON"
          echo "Pool host: ${{ env.POOL_HOST }}"

          # Intento 1: session pooler (puerto 5432)
          echo "--- Intento 1: session pooler (5432) ---"
          if pg_dump "$DB_SESSION" \
              --no-owner \
              --no-acl \
              --schema=public \
              --format=plain \
              --file="$FILENAME"; then
            echo "POOL_MODE=session:5432" >> "$GITHUB_ENV"
          else
            # Intento 2: transaction pooler (puerto 6543)
            echo "Session pooler falló. Intentando transaction pooler (6543)..."
            echo "--- Intento 2: transaction pooler (6543) ---"
            pg_dump "$DB_TRANSACTION" \
              --no-owner \
              --no-acl \
              --schema=public \
              --format=plain \
              --file="$FILENAME"
            echo "POOL_MODE=transaction:6543" >> "$GITHUB_ENV"
          fi

          # Verificar que el dump no está vacío
          LINES=$(wc -l < "$FILENAME")
          echo "Líneas en el dump: $LINES"
          if [ "$LINES" -lt 50 ]; then
            echo "ERROR: El dump parece estar vacío o incompleto ($LINES líneas)."
            exit 1
          fi

          # Comprimir
          gzip "$FILENAME"

          SIZE=$(du -sh "${FILENAME}.gz" | cut -f1)
          echo "BACKUP_FILE=${FILENAME}.gz" >> "$GITHUB_ENV"
          echo "BACKUP_SIZE=$SIZE"          >> "$GITHUB_ENV"
          echo "TIMESTAMP=$TIMESTAMP"       >> "$GITHUB_ENV"
          echo "REASON=$REASON"             >> "$GITHUB_ENV"
          echo "Dump completado: ${FILENAME}.gz ($SIZE)"

      - name: Subir artifact (retención 90 días)
        uses: actions/upload-artifact@v4
        with:
          name: logisalud-backup-${{ env.TIMESTAMP }}
          path: "*.sql.gz"
          retention-days: 90

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Backup completado"
            echo "| Campo       | Valor |"
            echo "|-------------|-------|"
            echo "| Archivo     | \`${{ env.BACKUP_FILE }}\` |"
            echo "| Tamaño      | ${{ env.BACKUP_SIZE }} |"
            echo "| Pool host   | ${{ env.POOL_HOST }} |"
            echo "| Modo        | ${{ env.POOL_MODE }} |"
            echo "| Motivo      | ${{ env.REASON }} |"
            echo "| Retención   | 90 días |"
            echo ""
            echo "Descarga desde **Summary → Artifacts** de este run."
          } >> "$GITHUB_STEP_SUMMARY"
