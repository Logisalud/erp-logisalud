# Un PR que toca supabase/migrations/ no se mergea solo.
#
# Mergear a main deploya a producción y, con la integración de Supabase,
# aplica las migraciones contra la base real. Un CHECK mal puesto o una
# migración no re-ejecutable no se deshace con un revert del código: la
# base ya cambió. Así que esos PRs los mergea una persona, a mano, después
# de mirar el SQL.
#
# Esto marca y avisa; no bloquea. Un bloqueo duro por check requerido
# también impediría el merge manual, que es justamente lo que queremos
# habilitar acá.
name: Marcar migraciones

# `pull_request`, no `pull_request_target`: todas las ramas viven en este
# mismo repo (no hay forks), así que el token ya tiene permiso de escritura,
# y `pull_request` no expone el token al código del PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  marcar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const pull_number = context.payload.pull_request.number

            const archivos = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 }
            )

            const migraciones = archivos
              .map((a) => a.filename)
              .filter((f) => f.includes('supabase/migrations/'))

            if (migraciones.length === 0) {
              core.info('Sin migraciones: el PR puede ir por auto-merge.')
              return
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number: pull_number,
              labels: ['migracion'],
            })

            // Un solo comentario por PR, no uno por push.
            const previos = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pull_number, per_page: 100 }
            )
            const marca = '<!-- marcar-migraciones -->'
            if (previos.some((c) => c.body?.includes(marca))) {
              core.info('El aviso ya está puesto.')
              return
            }

            const lista = migraciones.map((f) => `- \`${f}\``).join('\n')
            await github.rest.issues.createComment({
              owner, repo, issue_number: pull_number,
              body: [
                marca,
                '**Este PR toca migraciones. No va por auto-merge.**',
                '',
                lista,
                '',
                'Mergear a `main` las aplica contra la base real, y eso no se',
                'revierte con un revert del código. Revisá el SQL y mergealo a',
                'mano cuando estés conforme.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            })

            core.warning(`${migraciones.length} archivo(s) de migración: merge manual.`)
