name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pedidos:
    name: apps/pedidos — lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, no 20. Dos razones: la 20 ya está fuera de soporte y los
      # runners avisan que la deprecan, y jsdom (tests de componentes)
      # arrastra undici 8, que usa `worker_threads.markAsUncloneable` —
      # ausente en la 20.x del runner, así que el test ni arrancaba.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm workspaces: el install es siempre desde la raíz del monorepo,
      # contra el único package-lock.json. Los scripts se invocan por
      # workspace.
      - run: npm ci

      - run: npm run lint --workspace erp-logisalud-pedidos

      - run: npm run test --workspace erp-logisalud-pedidos

      - run: npm run build --workspace erp-logisalud-pedidos

  cobranzas:
    name: apps/cobranzas — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sin lint ni test: apps/cobranzas no tiene configuración de ESLint
      # (`next lint` arrancaría el asistente interactivo) ni suite de tests.
      # El build corre type-check completo de TypeScript, que es la
      # verificación que ese proyecto usa hoy.
      - run: npm run build --workspace erp-logisalud-cobranzas

  compras:
    name: apps/compras — test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sin lint: apps/compras no tiene configuración de ESLint (`next lint`
      # arrancaría el asistente interactivo). Sí tiene suite de dominio.
      - run: npm run test --workspace erp-logisalud-compras

      - run: npm run build --workspace erp-logisalud-compras

  wms:
    name: apps/wms — dominio, base de datos, build y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Postgres 16 de servicio: los tests de base de datos corren las migraciones del
    # WMS contra un Postgres con un schema `auth` simulado (ver apps/wms/tests/db/stubs.sql).
    # No es Supabase: no cubre PostgREST, GoTrue ni Storage (docs/wms/gate-0.md §G.1).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: wms_test
          POSTGRES_USER: wms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WMS_TEST_DATABASE_URL: postgres://wms_test:wms_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test --workspace erp-logisalud-wms

      # En CI el Postgres ya está (servicio): se llama a vitest directo, sin db-local.sh.
      - run: npx vitest run tests/db
        working-directory: apps/wms

      - run: npm run build --workspace erp-logisalud-wms

      # E2E en los 4 viewports, en modo demostración (datos de prueba, sin base real).
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e --workspace erp-logisalud-wms
        env:
          WMS_DEMO_LOCAL: '1'
